name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      OPERATORKIT_JWT_SECRET: github-actions-demo-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run baseline checks
        run: npm run check

      - name: Verify demo flow
        run: npm run verify:demo

      - name: Replay queue fixture
        run: npm run replay:request -- demo/requests/list-queue.json

      - name: Replay note fixture
        run: npm run replay:request -- demo/requests/create-note-and-queue.json

      - name: Replay connector fixture
        run: npm run replay:request -- demo/requests/send-connector-event.json
